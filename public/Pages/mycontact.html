<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mes contacts – Budget App</title>
  <meta name="description" content="Retrouvez et gérez vos destinataires enregistrés sur Budget App." />
  <link rel="canonical" href="mycontact.html" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="../Public/Assets/style.css" />

</head>

<body>
  <h1 class="visually-hidden">Mes contacts</h1>

    <div class="container">
        <div class="breadcrumb mt-3 d-flex justify-content-between">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index.html">Accueil</a></li>
                    <li class="breadcrumb-item"><a href="./transfert.html">Transfert</a></li>
                    <li class="breadcrumb-item active" aria-current="page">
                        <span class="bi bi-phone text-primary" style="font-size: 15px;"></span>
                        Mes contacts
                    </li>
                </ol>
            </nav>
            <a href="addnewrecipient.html" aria-label="Ajouter un destinataire"><i class="bi bi-plus fs-4 text-dark" aria-hidden="true"></i></a>
        </div>

        <div class="container-fluid mb-2">
            <div class="p-3 rounded-3 bg-secondary-subtle">
                <div class="input-group align-items-center rounded-3 px-2">
                    <span class="bg-transparent border-0 pe-2" id="searchicon">
                        <i class="bi bi-search text-muted fs-6" aria-hidden="true"></i>
                    </span>
                    <input type="text" class="form-control border-0 shadow-none fs-6 rounded-2" id="searchInput"
                        placeholder="Rechercher un destinataire" style="height: 45px;" />
                    <button class="btn border-0 p-2" type="button" id="clearSearch" aria-label="Effacer la recherche">
                        <i class="bi bi-x-circle-fill text-muted fs-6" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </div>
        <!-- Tableau -->
        <ul class="nav nav-tabs nav-fill mb-3" id="recipientTabs" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" id="phone-tab" data-bs-toggle="tab" data-bs-target="#phone"
                    type="button" role="tab" aria-controls="phone" aria-selected="true">
                    <!-- aria pour une meilleure accessibilité -->
                    Téléphone
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="bank-tab" data-bs-toggle="tab" data-bs-target="#bank" type="button"
                    role="tab" aria-controls="bank" aria-selected="false">
                    Compte bancaire
                </button>
            </li>
        </ul>
        <!-- Tableau contenu -->
        <div class="tab-content px-3" id="recipientTabsContent">
            <!-- Tableau téléphone -->
            <div class="tab-pane fade show active" id="phone" role="tabpanel">
                <!-- Injecté par JS depuis GET /api/recipients -->
            </div>
            <!-- Tableau des comptes bancaires -->
            <div class="tab-pane fade" id="bank" role="tabpanel">
                <!-- Injecté par JS depuis GET /api/recipients -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="/public/js/api.js"></script>
    <script>
        // Contacts : GET /api/recipients, rangés dans les onglets Téléphone / Compte bancaire
        UI.loadRecipients('phone', 'bank', 'searchInput');

        // Bouton pour vider la recherche
        document.getElementById('clearSearch').addEventListener('click', () => {
          const input = document.getElementById('searchInput');
          input.value = '';
          input.dispatchEvent(new Event('input'));
        });
    </script>

</body>

</html>
