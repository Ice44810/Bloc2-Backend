<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modifier le profil – Budget App</title>
  <meta name="description" content="Modifiez vos informations personnelles sur Budget App." />
  <link rel="canonical" href="edit-profil.html" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="../Public/Assets/style.css" />

</head>

<body>
  <h1 class="visually-hidden">Modifier le profil</h1>

    <div class="container">
        <div class="breadcrumb mt-3">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index.html">Accueil</a></li>
                    <li class="breadcrumb-item">
                        <a href="./profile.html">Profil</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">
                        <span class="bi bi-gear text-black" style="font-size: 15px;"></span>
                        Gérer le profil
                    </li>
                </ol>
            </nav>
        </div>
        <div class="container-fluid p-3">
            <div class="text-center mb-4">
                <img src="../Public/Assets/images/profil.jpg" alt="Profil" class="rounded-circle small-profile-img mb-2"
                    width="100" height="100">
                <a href="#" class="d-block text-primary">
                    <i class="bi bi-camera me-1" aria-label="changer la photo du profil" aria-hidden="true">  
                    </i> Changer la photo</a>
            </div>
            <form id="profileForm">
                <div class="mb-3">
                    <label for="fullName" class="form-label">Nom complet</label>
                    <input type="text" class="form-control" id="fullName" value="Themesflat Dupont">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" value="themesflat@budgetapp.com">
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Numéro de téléphone</label>
                    <input type="tel" class="form-control" id="phone" value="+33 6 12 34 56 78">
                </div>
                <div class="mb-3">
                    <label for="address" class="form-label">Adresse</label>
                    <input type="text" class="form-control" id="address" value="12 Rue de la Finance">
                </div>
                <div class="mb-3">
                    <label for="postcode" class="form-label">Code postal</label>
                    <input type="text" inputmode="numeric" class="form-control" id="postcode" value="44000">
                </div>
                <div class="mb-3">
                    <label for="ville" class="form-label">Ville</label>
                    <input type="text" class="form-control" id="ville" value="Nantes">
                </div>
                <button type="submit" class="btn custom-primary-btn" id="btnUpdate">Sauvegarder les
                    changements</button>
            </form>
        </div>
    </div>

    <script src="/public/js/api.js"></script>
    <script>
        const fields = ["fullName", "email", "phone", "address", "postcode", "ville"];

        // 1. Au chargement : GET /api/users/profile pour pré-remplir le formulaire
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const user = await api.getProfile();
                fields.forEach(field => {
                    document.getElementById(field).value = user[field] || "";
                });
            } catch (error) {
                alert("Impossible de charger le profil : " + error.message);
            }
        });

        // 2. À l'envoi : PUT /api/users/profile avec les nouvelles valeurs
        document.getElementById("profileForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const data = {};
            fields.forEach(field => {
                data[field] = document.getElementById(field).value.trim();
            });

            try {
                await api.updateProfile(data);
                alert("Profil mis à jour !");
            } catch (error) {
                alert("Erreur : " + error.message);
            }
        });

        // 3. Gestion du changement de photo (non implémenté côté serveur)
        document.querySelector(".bi-camera").addEventListener("click", () => {
            alert("Fonctionnalité de changement de photo non implémentée.");
        });
        
    </script>
</body>

</html>
