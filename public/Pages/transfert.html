<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transfert vers un contact – Budget App</title>
  <meta name="description" content="Envoyez de l'argent à un contact depuis Budget App." />
  <link rel="canonical" href="transfert.html" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Public/Assets/style.css">

</head>

<body>
  <h1 class="visually-hidden">Transfert vers un contact</h1>

    <!-- HEADER -->
    <div class="container">
        <div class="breadcrumb mt-3">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index.html">Accueil</a></li>
                    <li class="breadcrumb-item"><a href="./mycontact.html">Mes Contacts</a></li>
                    <li class="breadcrumb-item active" aria-current="page">
                        <span class="bi bi-arrow-left-right text-primary" style="font-size: 15px;"></span>
                        Transfert
                    </li>
                </ol>
            </nav>
        </div>

        <div class="container py-3">
            <!-- BALANCE CARD -->
            <div class="balance-card bg-light-subtle">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-muted small">Solde disponible:</span>
                    <span class="fw-bold fs-5" id="currentBalance">…</span>
                </div>
                <label for="recipientSelect" class="form-label text-muted small mb-1">Destinataire</label>
                <!-- Options injectées par JS depuis GET /api/recipients -->
                <select id="recipientSelect" class="form-select fw-semibold"></select>
            </div>

            <!-- AMOUNT -->
            <div class="form-box mt-3">
                <label for="amountInput" class="form-label text-muted">Montant</label>
                <div class="position-relative">
                    <input type="text" id="amountInput" class="form-control border p-2" inputmode="decimal" placeholder="€0">
                    <i class="bi bi-x-circle-fill position-absolute top-50 end-0 translate-middle-y me-3 text-muted"
                        id="clearAmount" style="cursor: pointer;" aria-hidden="true"></i>
                </div>
                <div class="d-flex justify-content-between mt-3">
                    <button class="amount-btn btn-outline-primary w-100" type="button">€50</button>
                    <button class="amount-btn btn-outline-primary w-100" type="button">€75</button>
                    <button class="amount-btn btn-outline-primary w-100" type="button">€150</button>
                </div>
            </div>

            <!-- EMPLACEMENT DU MESSAGE -->
            <div class="mt-2">
                <label class="form-label text-muted">Message</label>
                <input type="text" id="message" class="form-control amount-input large text-muted"
                    placeholder="votre message...">
            </div>
        </div>

        <button type="button" class="btn btn-primary continue-btn">Continuer</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/public/js/api.js"></script>

    <script>
        // Script pour la selection du montant
        document.addEventListener("DOMContentLoaded", function () {
            const amountInput = document.getElementById('amountInput');
            const amountButtons = document.querySelectorAll('.amount-btn');

            amountButtons.forEach(button => {
                button.addEventListener('click', function () {
                    // Récupérer le montant du bouton cliqué
                    const selectedAmount = this.textContent;

                    // Mettre à jour la valeur de l'input
                    amountInput.value = selectedAmount;

                    //  Gérer l'état visuel "actif"
                    // On retire la classe active de tous les boutons
                    amountButtons.forEach(btn => btn.classList.remove('active'));
                    // On l'ajoute au bouton cliqué
                    this.classList.add('active');
                });
            });
        });

        let recipients = [];

        // Solde (GET /api/balance) et liste des contacts (GET /api/recipients)
        async function loadTransferData() {
            try {
                const [balance, list] = await Promise.all([api.getBalance(), api.getRecipients()]);
                recipients = list;
                document.getElementById("currentBalance").textContent = UI.formatCurrency(balance.balance);

                const select = document.getElementById("recipientSelect");
                if (recipients.length === 0) {
                    select.innerHTML = '<option value="">Aucun contact enregistré</option>';
                    return;
                }
                select.innerHTML = recipients
                    .map(r => `<option value="${r.id}">${UI.escapeHtml(r.name)} (${UI.escapeHtml(r.identifier)})</option>`)
                    .join("");

                // Contact choisi depuis sa fiche : transfert.html?recipient=4
                const preselected = new URLSearchParams(window.location.search).get("recipient");
                if (preselected) select.value = preselected;
            } catch (error) {
                console.error("Erreur API :", error);
            }
        }
        loadTransferData();

        document.getElementById("clearAmount").addEventListener("click", () => {
            const amountInput = document.getElementById("amountInput");
            amountInput.value = "";
            amountInput.focus();
        });

        // Continuer : on mémorise le transfert puis on passe au choix de la source de paiement
        document.querySelector(".continue-btn").addEventListener("click", () => {
            const recipient = recipients.find(r => String(r.id) === document.getElementById("recipientSelect").value);
            const amount = UI.parseAmount(document.getElementById("amountInput").value);

            if (!recipient) {
                alert("Choisissez un destinataire.");
                return;
            }
            if (!amount || amount <= 0) {
                alert("Saisissez un montant valide.");
                return;
            }

            Payment.start({
                kind: "transfer",
                amount,
                recipientId: recipient.id,
                recipientName: recipient.name,
                recipientIdentifier: recipient.identifier,
                message: document.getElementById("message").value.trim()
            });
        });
    </script>

</body>

</html>
