<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Source de paiement – Budget App</title>
  <meta name="description" content="Choisissez la source de paiement pour votre opération Budget App." />
  <link rel="canonical" href="paymentsource.html" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Public/Assets/style.css">

</head>

<body>
  <h1 class="visually-hidden">Source de paiement</h1>

    <!-- HEADER -->
    <div class="container">
        <div class="breadcrumb mt-3">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index.html">Accueil</a></li>
                    <li class="breadcrumb-item"><a href="./bill.html">Transfert</a></li>
                    <li class="breadcrumb-item active" aria-current="page">
                        <span class="bi bi-arrow-left-right" style="font-size: 15px;"></span>
                        Transfert
                    </li>
                </ol>
            </nav>
        </div>

        <div class="container">
            <!--DETAILS TRANSFERT-->
            <div class="transfer-card text-center">
                <div class="mb-3">
                    <img src="https://img.icons8.com/fluency/48/money-bag.png" alt="money">
                </div>
                <div class="d-flex justify-content-center align-items-center gap-1">
                    <span class="fs-3">€</span>
                    <span class="amount" id="paymentAmount">…</span>
                </div>
                <p class="text-muted mb-3 small" id="paymentLabel">Montant transfert</p>
                <div class="divider">
                </div>
                <div class="d-flex justify-content-between"><span class="text-muted small">Frais transaction
                    </span><strong class="small">Gratuit</strong>
                </div>
            </div>
            <!-- METHODE DE PAIEMENTS -->
            <div class="mt-3">
                <!-- Sources injectées par JS : le solde + les cartes (GET /api/cards) -->
                <div id="paymentSources"></div>
            </div>
        </div>
        <div class="d-flex justify-content-end">
            <button type="button" id="btnConfirmSource" class="btn btn-primary confirm-btn mx-3">Confirmer
                    Paiement</button>
        </div>
    </div>

    <script src="/public/js/api.js"></script>
    <script>
        const payment = Payment.get();

        function selectPayment(element) {
            //  On retire la classe 'active' de tous les blocs de paiement
            document.querySelectorAll('.clickable-payment').forEach(card => {
                card.classList.remove('active');
            });
            //  On ajoute la classe 'active' au bloc cliqué
            element.classList.add('active');
            // On trouve le bouton radio à l'intérieur et on le coche
            const radio = element.querySelector('.form-check-input');
            radio.checked = true;
        }

        function sourceHtml(source, checked) {
            return `
                <div class="payment-card d-flex align-items-center justify-content-between p-3 mb-2 rounded-3 border clickable-payment ${checked ? 'active' : ''}"
                    onclick="selectPayment(this)">
                    <div class="d-flex align-items-center gap-3">
                        <i class="bi ${source.icon} fs-3 text-primary" aria-hidden="true"></i>
                        <div>
                            <strong>${UI.escapeHtml(source.title)}</strong><br>
                            <span class="text-muted small">${UI.escapeHtml(source.detail)}</span>
                        </div>
                    </div>
                    <input class="form-check-input" type="radio" name="payment_method"
                        value="${UI.escapeHtml(source.title + ' ' + source.detail)}" ${checked ? 'checked' : ''}>
                </div>`;
        }

        async function loadSources() {
            // Pas de paiement en cours (page ouverte directement) : retour à l'accueil
            if (!payment) {
                window.location.href = './index.html';
                return;
            }
            document.getElementById('paymentAmount').textContent = payment.amount.toFixed(2);
            document.getElementById('paymentLabel').textContent = payment.kind === 'bill'
                ? `Facture ${payment.serviceName} (${payment.provider})`
                : `Transfert à ${payment.recipientName}`;

            try {
                const [balance, cards] = await Promise.all([api.getBalance(), api.getCards()]);
                const sources = [
                    { icon: 'bi-wallet2', title: 'Portefeuille', detail: `Solde : ${UI.formatCurrency(balance.balance)}` },
                    ...cards.map(card => ({ icon: 'bi-credit-card', title: `Carte ${card.card_brand}`, detail: `**** **** **** ${card.last_4_digits}` }))
                ];
                document.getElementById('paymentSources').innerHTML = sources.map((source, i) => sourceHtml(source, i === 0)).join('');
            } catch (error) {
                console.error('Erreur API :', error);
            }
        }
        loadSources();

        // On mémorise la source choisie puis on va à la confirmation
        document.getElementById('btnConfirmSource').addEventListener('click', () => {
            const selected = document.querySelector('input[name="payment_method"]:checked');
            Payment.update({ source: selected ? selected.value : 'Portefeuille' });
            window.location.href = './transferconfirm.html';
        });
    </script>
</body>

</html>
