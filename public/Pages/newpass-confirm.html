<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe confirmé – Budget App</title>
  <meta name="description" content="Votre mot de passe Budget App a été modifié avec succès." />
  <link rel="canonical" href="newpass-confirm.html" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../Public/Assets/style.css">

</head>

<body>
    <div class="text-center border-0">
        <img src="../Public/Assets/images/new-pass.jpg" alt="Illustration de confirmation du mot de passe" class="img-fluid" style="font-size: 1.2rem;">
        <h1 class="mt-3 fw-bold fs-2">Mot de passe confirmé avec succès !</h1>
        <p class="text-muted small">Votre nouveau mot de passe a bien été confirmé. Veuillez l'utiliser lors de
            votre
            prochaine connexion.</p>
    </div>

    <div class="d-flex justify-content-end mt-3">
        <a href="./login.html" class="btn custom-primary-btn mx-5" id="btnToLogin">Se connecter</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        document.addEventListener("DOMContentLoaded", function () {
            const btn = document.getElementById("btnToLogin");
            btn.addEventListener("click", function () {
                window.location.href = "./login.html";
            });
        });
    </script>

</body>

</html>
