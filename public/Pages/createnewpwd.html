<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe – Budget App</title>
  <meta name="description" content="Définissez un nouveau mot de passe pour votre compte Budget App." />
  <link rel="canonical" href="createnewpwd.html" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../Public/Assets/style.css" />
</head>

<body>
  <div class="container">
    <div class="breadcrumb mt-3">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="login.html">Connexion</a></li>
          <li class="breadcrumb-item"><a href="./resetpassword.html">Mot de passe oublié</a></li>
          <li class="breadcrumb-item active" aria-current="page"><span class="bi bi-gear text-black"
              style="font-size: 15px;"></span>Créer un nouveau mot de passe </li>
        </ol>
      </nav>
    </div>
    <p class="text-black"></p>
    <h1 class="mb-0 fs-4 text-black fw-bold">Nouveau mot de passe</h1><br>
    <div class="form m-auto">
      <div class=" mb-4 position-relative"><label class="position-absolute text-muted fs-6"
          style="top: -13px; left: 0; z-index: 5;">Mot de passe </label>
        <div class="border rounded-3 d-flex align-items-center" style="height: 40px;"><input type="password" id="newPassword"
            class="form-control border-0 bg-transparent fs-6" placeholder="6 - 20 caractères"
            style="box-shadow: none;"></div>
      </div>
      <div class=" mb-4 position-relative"><label class="position-absolute text-muted fs-6"
          style="top: -13px; left: 0; z-index: 5;">Confirmer mot de passe </label>
        <div class="border rounded-3 d-flex align-items-center" style="height: 40px;"><input type="password" id="confirmPassword"
            class="form-control border-0 bg-transparent fs-6" placeholder="6 - 20 caractères"
            style="box-shadow: none;"></div>
      </div>
      <div class="d-flex justify-content-end gap-2"><button class="btn btn-primary text-white"
          id="btnToOTP">Réinitialiser le mot de passe</button></div>
    </div>

    <!-- MODALS -->
    <div class="modal fade modal-top" id="otpModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog m-0 w-100 shadow-lg">
        <div class="modal-content rounded-4 p-4 text-center">
          <button type="button" class="btn-close position-absolute top-0 start-0 m-3" data-bs-dismiss="modal"
            aria-label="Fermer">
          </button>
          <h6 class="fw-semibold mb-4">Verification OTP</h6>
          <div class="d-flex justify-content-center gap-2 mb-3">
            <input type="text" maxlength="1" inputmode="numeric" class="otp-input" aria-label="Chiffre 1" />
            <input type="text" maxlength="1" inputmode="numeric" class="otp-input" aria-label="Chiffre 2" />
            <input type="text" maxlength="1" inputmode="numeric" class="otp-input" aria-label="Chiffre 3" />
            <input type="text" maxlength="1" inputmode="numeric" class="otp-input" aria-label="Chiffre 4" />
            <input type="text" maxlength="1" inputmode="numeric" class="otp-input" aria-label="Chiffre 5" />
            <input type="text" maxlength="1" inputmode="numeric" class="otp-input" aria-label="Chiffre 6" />
          </div>
          <p class="text-muted mb-1 small">Saisissez le code à 6 chiffres reçu (valable 15 minutes)</p>
          <p class="mb-4"><span id="resendText" class="text-primary fw-semibold"><span
                id="timer">01:00</span></span></p><br><button
            class="btn btn-primary w-100 rounded-3 py-2" id="btnToLoading">Continuer </button>
        </div>
      </div>
    </div>
    <div class="modal fade" id="loadingModal" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 bg-transparent text-center">
          <div class="spinner-border text-white mb-3" style="width: 3rem; height: 3rem"></div>
          <p class="text-white fw-bold">Encours...</p>
        </div>
      </div>
    </div>
    <div class="modal fade" id="successModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 p-5 text-center bg-primary text-white overflow-hidden">
          <div class="bg-white rounded-4 p-4 text-dark shadow position-relative" style="z-index: 2">
            <div class="bg-success rounded-circle d-inline-flex p-3 mb-3 text-white"><i
                class="bi bi-check-lg fs-1" aria-hidden="true"></i></div>
            <h4 class="fw-bold">Succes !</h4>
            <p class="text-muted small">Votre mot de passe a été modifié !</p><button
              class="btn btn-primary w-100 py-3" id="btnDone">Terminer </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/public/js/api.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Email saisi sur la page resetpassword.html
      const email = sessionStorage.getItem("reset_email");
      if (!email) {
        window.location.href = "./resetpassword.html";
        return;
      }

      // Initialisation des modals
      const modalOtp = new bootstrap.Modal(document.getElementById("otpModal"));
      const modalLoading = new bootstrap.Modal(document.getElementById("loadingModal"));
      const modalSuccess = new bootstrap.Modal(document.getElementById("successModal"));
      const otpInputs = document.querySelectorAll(".otp-input");

      // 1. Vérifier les mots de passe puis ouvrir la saisie du code
      document.getElementById("btnToOTP").addEventListener("click", () => {
        const newPass = document.getElementById("newPassword").value;
        const confirmPass = document.getElementById("confirmPassword").value;

        if (newPass.length < 6 || newPass.length > 20) {
          alert("Le mot de passe doit contenir entre 6 et 20 caractères.");
          return;
        }
        if (newPass !== confirmPass) {
          alert("Les mots de passe ne correspondent pas.");
          return;
        }
        modalOtp.show();
        startTimer();
      });

      // 2. Code -> POST /api/users/reset-password-confirm -> Succès
      document.getElementById("btnToLoading").addEventListener("click", async () => {
        const code = Array.from(otpInputs).map(input => input.value).join("");
        if (code.length !== 6) {
          alert("Saisissez les 6 chiffres du code.");
          return;
        }

        modalOtp.hide();
        await UI.wait(400);
        modalLoading.show();

        try {
          await api.resetPassword(email, code, document.getElementById("newPassword").value);
          sessionStorage.removeItem("reset_email");
          await UI.wait(800);
          modalLoading.hide();
          await UI.wait(500);
          modalSuccess.show();
        } catch (error) {
          await UI.wait(400);
          modalLoading.hide();
          alert(error.message);
          otpInputs.forEach(input => input.value = "");
        }
      });

      // 3. Terminé : page de confirmation puis connexion
      document.getElementById("btnDone").addEventListener("click", () => {
        window.location.href = "./newpass-confirm.html";
      });

      // 4. Auto-focus des cases du code (et retour en arrière avec Effacer)
      otpInputs.forEach((input, index) => {
        input.addEventListener("input", () => {
          if (input.value && index < otpInputs.length - 1) otpInputs[index + 1].focus();
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !input.value && index > 0) otpInputs[index - 1].focus();
        });
      });

      // 5. Compte à rebours affiché dans le modal
      let countdown = null;
      function startTimer() {
        let timeLeft = 60;
        const timerElement = document.getElementById("timer");
        clearInterval(countdown);
        countdown = setInterval(() => {
          const m = Math.floor(timeLeft / 60);
          const s = timeLeft % 60;
          timerElement.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
          if (timeLeft <= 0) clearInterval(countdown);
          else timeLeft--;
        }, 1000);
      }
    });
  </script>
</body>

</html>
