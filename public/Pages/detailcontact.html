<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détail du contact – Budget App</title>
  <meta name="description" content="Consultez les informations d'un destinataire Budget App." />
  <link rel="canonical" href="detailcontact.html" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../Public/Assets/style.css" />
</head>

<body>
  <h1 class="visually-hidden">Détail du contact</h1>

  <!-- HEADER -->
  <div class="container">
    <div class="breadcrumb mt-3 d-flex justify-content-between">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Accueil</a></li>
          <li class="breadcrumb-item">
            <a href="./profile.html">Profil</a>
          </li>
          <li class="breadcrumb-item active" aria-current="page">
            <span class="bi bi-gear text-black" style="font-size: 15px;"></span>
            Détails Contact
          </li>
        </ol>
      </nav>
      <button type="button" class="btn border-0 p-0 text-dark" data-bs-toggle="offcanvas"
        data-bs-target="#actionSheetAccount" aria-label="Ouvrir les actions du contact">
        <i class="bi bi-three-dots-vertical fs-5" aria-hidden="true"></i>
      </button>
      <!-- Offcanvas paramètres ouverture bas -->
      <div class="offcanvas offcanvas-bottom action-sheet-ios" tabindex="-1" id="actionSheetAccount">
        <div class="offcanvas-body p-2">
          <div class="list-group shadow-sm mb-2 rounded-4">
            <a href="#" id="editContact" class="list-group-item list-group-item-action text-center py-3"
              data-bs-dismiss="offcanvas">
              Editer <!-- data-bs-dismiss="offcanvas" renvoie à la page detailcontact -->
            </a>
            <a href="#" id="deleteContact"
              class="list-group-item list-group-item-action text-center py-3 text-danger fw-semibold"
              data-bs-dismiss="offcanvas">
              Supprimer
            </a>
          </div>
          <button type="button" class="btn btn-white w-100 py-3 shadow-sm rounded-4 fw-bold text-primary-ios"
            data-bs-dismiss="offcanvas">
            Annuler
          </button>

        </div>
      </div>
    </div>
  </div>

  <!-- PROFILE -->
  <div class="text-center mt-2">
    <div class="position-relative d-inline-block">
      <div class="rounded-circle profile-img bg-primary-subtle text-primary fw-bold fs-2 d-flex align-items-center justify-content-center"
        id="contactAvatar" aria-hidden="true">…</div>
      <span class="camera-icon">
        <i class="bi bi-camera" aria-hidden="true"></i>
        <span class="visually-hidden">Changer la photo de profil</span>
      </span>
    </div>
    <h2 class="mt-2 fw-bold fs-5" id="contactName">…</h2>
    <div class="d-flex justify-content-center align-items-center gap-2 text-muted mt-1">
      <span id="accountNumber" class="small">…</span>
      <button type="button" class="btn border-0 p-0 copy-icon" id="copyBtn" aria-label="Copier le numéro de compte"
        style="cursor:pointer; font-size: 0.9rem;">
        <i class="bi bi-clipboard" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <!-- Boutons action -->
  <div class="d-flex justify-content-center gap-4 mt-4">
    <div class="text-center">
      <div class="action-btn mx-auto" id="sendMoneyBtn">
        <a href="./transfert.html" id="transferLink" aria-label="Transférer de l'argent">
          <i class="bi bi-arrow-left-right" aria-hidden="true"></i></a>
      </div>
      <small class="d-block mt-2">Transfert</small>
    </div>
    <div class="text-center">
      <div class="action-btn mx-auto" id="requestBtn">
        <a href="myqr.html" aria-label="Demander de l'argent">
        <i class="bi bi-arrow-down-left" aria-hidden="true"></i></a>
      </div>
      <small class="d-block mt-2">Demander</small>
    </div>
    <div class="text-center">
      <button type="button" class="btn border-0 p-0 action-btn mx-auto" id="shareBtn" aria-label="Partager le contact">
        <i class="bi bi-share" aria-hidden="true"></i>
      </button>
      <small class="d-block mt-2">Partager</small>
    </div>
  </div>

  <!-- INFO LIST -->
  <div class="container mt-5">
    <div class="row info-row align-items-center">
      <div class="col-1"><i class="bi bi-person" aria-hidden="true"></i></div>
      <div class="col" id="infoName">…</div>
    </div>
    <div class="row info-row align-items-center border-0">
      <div class="col-1"><i class="bi bi-credit-card" aria-hidden="true" id="infoIcon"></i></div>
      <div class="col" id="infoIdentifier">…</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="/public/js/api.js"></script>
  <script>
    // Le contact à afficher est dans l'adresse : detailcontact.html?id=4
    const contactId = new URLSearchParams(window.location.search).get("id");
    let contact = null;

    function showContact() {
      document.getElementById("contactAvatar").textContent = UI.initials(contact.name);
      document.getElementById("contactName").textContent = contact.name;
      document.getElementById("infoName").textContent = contact.name;
      document.getElementById("accountNumber").textContent = contact.identifier;
      document.getElementById("infoIdentifier").textContent = contact.identifier;
      document.getElementById("infoIcon").className = contact.type === "phone" ? "bi bi-telephone" : "bi bi-credit-card";
      document.getElementById("transferLink").href = `./transfert.html?recipient=${contact.id}`;
    }

    // GET /api/recipients/:id
    async function loadContact() {
      if (!contactId) {
        window.location.href = "./mycontact.html";
        return;
      }
      try {
        contact = await api.getRecipient(contactId);
        showContact();
      } catch (error) {
        alert("Contact introuvable : " + error.message);
        window.location.href = "./mycontact.html";
      }
    }
    loadContact();

    // Editer : PUT /api/recipients/:id
    document.getElementById("editContact").addEventListener("click", async (e) => {
      e.preventDefault();
      const name = prompt("Nom du contact", contact.name);
      if (name === null) return; // clic sur Annuler
      const identifier = prompt(contact.type === "phone" ? "Numéro de téléphone" : "IBAN", contact.identifier);
      if (identifier === null) return;
      if (!name.trim() || !identifier.trim()) {
        alert("Le nom et l'identifiant ne peuvent pas être vides.");
        return;
      }
      try {
        await api.updateRecipient(contact.id, { name: name.trim(), identifier: identifier.trim(), type: contact.type });
        contact.name = name.trim();
        contact.identifier = identifier.trim();
        showContact();
      } catch (error) {
        alert("Modification impossible : " + error.message);
      }
    });

    // Supprimer : DELETE /api/recipients/:id
    document.getElementById("deleteContact").addEventListener("click", async (e) => {
      e.preventDefault();
      if (!confirm(`Supprimer ${contact.name} de vos contacts ?`)) return;
      try {
        await api.deleteRecipient(contact.id);
        window.location.href = "./mycontact.html";
      } catch (error) {
        alert("Suppression impossible : " + error.message);
      }
    });

    // Partager : menu de partage du téléphone, sinon copie dans le presse-papier
    document.getElementById("shareBtn").addEventListener("click", () => {
      const text = `${contact.name} : ${contact.identifier}`;
      if (navigator.share) {
        navigator.share({ title: contact.name, text }).catch(() => {});
      } else {
        navigator.clipboard.writeText(text).then(() => alert("Contact copié !"));
      }
    });

    document.getElementById("copyBtn").addEventListener("click", () => {
      const accountNumber = document.getElementById("accountNumber").innerText;
      navigator.clipboard.writeText(accountNumber).then(() => {
        alert("numéro copié!");
      });
    });

  </script>

</body>

</html>
