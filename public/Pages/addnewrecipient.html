<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau destinataire – Budget App</title>
  <meta name="description" content="Ajoutez un nouveau destinataire à vos contacts Budget App." />
  <link rel="canonical" href="addnewrecipient.html" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="../Public/Assets/style.css" />
</head>

<body>
  <h1 class="visually-hidden">Nouveau destinataire</h1>

  <div class="container py-4 bg-white" style="max-width: 600px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <a href="./mycontact.html" class="btn btn-link text-dark text-decoration-none fw-medium p-0">Annuler</a>
      <button type="submit" form="recipientForm" class="btn btn-link text-primary text-decoration-none fw-bold p-0"
          style="color: #6366f1 !important;">Valider</button>
    </div>

    <div class="text-center mb-5">
      <div class="position-relative d-inline-block">
        <div class="rounded-circle bg-light d-flex align-items-center justify-content-center"
          style="width: 120px; height: 120px;">
          <i class="bi bi-person-fill text-secondary" style="font-size: 80px;" aria-hidden="true"></i>
        </div>
        <div
          class="position-absolute bottom-0 end-0 bg-dark rounded-circle d-flex align-items-center justify-content-center border border-white border-2"
          style="width: 32px; height: 32px;">
          <i class="bi bi-camera-fill text-white small" aria-hidden="true"></i>
        </div>
      </div>
    </div>

    <form class="form-group" id="recipientForm">
      <div class="form-floating mb-3">
        <input type="text" class="form-control shadow-none border" id="recipientName"
          placeholder="Recipient Name" required>
        <label for="recipientName" class="text-muted" style="top: -15px;">Nom du destinataire</label>
      </div>

      <div class="form-floating mb-3 position-relative">
        <input type="text" class="form-control shadow-none border" id="accountNumber"
          placeholder="Account Number">
        <label for="accountNumber" class="text-muted" style="top: -15px;">IBAN / numéro de compte</label>
      </div>

      <div class="form-floating mb-3 position-relative">
        <input type="tel" class="form-control shadow-none border" id="phoneNumber" placeholder="Phone Number">
        <label for="phoneNumber" class="text-muted" style="top: -15px;">Numéro de téléphone</label>
        <i
          class="bi bi-x-circle-fill position-absolute top-50 end-0 translate-middle-y me-3 text-secondary opacity-50" aria-hidden="true"></i>
      </div>

      <p class="small text-muted">Remplissez l'IBAN <strong>ou</strong> le téléphone.</p>
    </form>
  </div>
  <script src="/public/js/api.js"></script>
  <script>
    // Effacer le téléphone avec la petite croix
    document.querySelector('#phoneNumber + label + .bi-x-circle-fill').addEventListener('click', () => {
      document.getElementById('phoneNumber').value = '';
    });

    // POST /api/recipients : un contact est soit un compte bancaire, soit un téléphone
    document.getElementById('recipientForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('recipientName').value.trim();
      const account = document.getElementById('accountNumber').value.trim();
      const phone = document.getElementById('phoneNumber').value.trim();

      if (!name || (!account && !phone)) {
        alert("Indiquez un nom et un IBAN ou un numéro de téléphone.");
        return;
      }

      const data = account
        ? { name, identifier: account, type: 'bank' }
        : { name, identifier: phone, type: 'phone' };

      try {
        const recipient = await api.createRecipient(data);
        window.location.href = `./detailcontact.html?id=${recipient.id}`;
      } catch (error) {
        alert("Impossible d'ajouter le contact : " + error.message);
      }
    });
  </script>

</body>

</html>
