<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facture internet – Budget App</title>
  <meta name="description" content="Payez votre facture internet depuis Budget App." />
  <link rel="canonical" href="internet.html" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="../Public/Assets/style.css" />

</head>

<body>
  <h1 class="visually-hidden">Facture internet</h1>

    <!-- Header -->
    <div class="container">
        <div class="breadcrumb mt-3">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index.html">Accueil</a></li>
                    <li class="breadcrumb-item"><a href="./bill.html">Factures</a></li>
                    <li class="breadcrumb-item active" aria-current="page">
                        <span class="bi bi-wifi" style="font-size: 15px;"></span>
                        Opérateur Internet
                    </li>
                </ol>
            </nav>
        </div>

        <div class="text-center py-3 bg-white rounded-4 shadow-sm">
            <div class="bill-icon mb-4">
                <img src="../Public/Assets/images/verifier.png" alt="approbation icon">
            </div>
            <h3 id="billAmount" class="fw-bold text-success">€ 21.5</h3>
            <p class="fs-5 small fw-semibold">Modalités de paiement décembre 2026</p>
            <p class="text-muted">Mise à jour par l'opérateur</p>
        </div><br>
        <p class="fw-bold mb-2">Informations Client</p>
        <div class="text-center bg-white rounded-4 shadow-sm p-3">
            <div class="d-flex justify-content-between">
                <!-- Colonne gauche -->
                <div class="text-start">
                    <p>Code client</p>
                    <p>Nom client</p>
                    <p>Mail</p>
                </div>
                <!-- Colonne droite -->
                <div class="text-end">
                    <p id="clientCode">…</p>
                    <p id="clientName">…</p>
                    <p id="clientEmail">…</p>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <button type="button" id="btnPayBill" aria-label="effectuer un paiement" class="btn custom-primary-btn fs-4">Paiement Facture</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/public/js/api.js"></script>
    <script>
        // Informations client : GET /api/users/profile
        api.getProfile().then(user => {
            document.getElementById("clientCode").textContent = "BA" + String(user.id).padStart(6, "0");
            document.getElementById("clientName").textContent = user.fullName || "—";
            document.getElementById("clientEmail").textContent = user.email;
        }).catch(error => console.error("Erreur API :", error));

        // Montant de la facture (simulé : pas de vrai fournisseur derrière)
        const bill = { serviceId: 2, serviceName: "Internet", provider: "Free", amount: 21.5 };
        document.getElementById("billAmount").textContent = UI.formatCurrency(bill.amount);

        // Payer : on prépare le paiement puis on passe au choix de la source
        document.getElementById("btnPayBill").addEventListener("click", () => {
            Payment.start({ kind: "bill", ...bill });
        });
    </script>

</body>

</html>
