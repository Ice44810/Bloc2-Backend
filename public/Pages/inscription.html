<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription – Budget App</title>
  <meta name="description" content="Créez un compte Budget App pour gérer votre budget, vos transferts et vos factures." />
  <link rel="canonical" href="inscription.html" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../Public/Assets/style.css" />
</head>

<body>
    <div class="container-fluid bg-white mb-2 mt-4">
        <div class="d-flex align-items-center p-3">
            <a href="rewards.html" class="text-dark text-decoration-none" aria-label="Retour">
                <i class="bi bi-chevron-left fw-bold" aria-hidden="true"></i>
            </a>
            <h1 class="mb-0 fw-semibold flex-grow-1 text-center me-4 fs-5">Inscription</h1>
        </div>
    </div>

    <form id="registerForm" class="container-md shadow-sm p-4 rounded-3 border">
        <div class="mb-3 px-3">
            <label for="nom" class="form-label ">Nom complet</label>
            <input type="text" class="form-control" id="nom" placeholder="saisir votre nom" required />
        </div>
        <div class="mb-3 px-3">
            <label for="email" class="form-label">Adresse Mail</label>
            <input type="email" class="form-control" id="email" placeholder="saisir adresse mail" required />
        </div>
        <div class="mb-3 px-3">
            <label for="motdepasse" class="form-label">Mot de passe</label>
            <input type="password" class="form-control" id="motdepasse" placeholder="saisir mot de passe" required />
        </div>
        <div class="mb-3 px-3">
            <label for="confirmmotdepasse" class="form-label">Confirmer Mot de passe</label>
            <input type="password" class="form-control" id="confirmmotdepasse" placeholder="confirmer mot de passe"
                required />
        </div>
        <div class="d-flex justify-content-end mt-3 mx-3 fs-4">
            <button type="submit" aria-label="confirmer inscription" class="btn btn-primary">S'inscrire</button>
        </div>
    </form>

    <script src="/public/js/api.js"></script>
    <script>
        //  Assurez-vous que l'ID dans le HTML correspond (registerForm)
        const registerForm = document.getElementById("registerForm");

        registerForm.addEventListener("submit", async function (event) {
            event.preventDefault();  // Empêche le rechargement de la page

            // Récupération des valeurs des champs
            const nom = document.getElementById("nom").value.trim();
            const email = document.getElementById("email").value.trim();
            const motdepasse = document.getElementById("motdepasse").value.trim();
            const confirmMotDePasse = document.getElementById("confirmmotdepasse").value.trim();

            if (!nom || !email || !motdepasse || !confirmMotDePasse) {
                alert("Tous les champs doivent être remplis.");
                return;
            }

            // Validation de l'email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert("Adresse mail invalide.");
                return;
            }

            // Validation de la longueur du mot de passe
            if (motdepasse.length < 6) {
                alert("Le mot de passe doit contenir au moins 6 caractères.");
                return;
            }

            // Correction 4: Comparaison des deux mots de passe
            if (motdepasse !== confirmMotDePasse) {
                alert("Les mots de passe ne correspondent pas.");
                return;
            }

            // Appel à POST /register : le serveur crée l'utilisateur en base
            try {
                await api.register(nom, email, motdepasse);
                alert("Compte créé avec succès pour " + nom + " !");
                window.location.href = "login.html";
            } catch (error) {
                alert(error.message);
            }

        });

        // Fin du script
    </script>
</body>
</body>

</html>
