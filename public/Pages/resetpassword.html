<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialiser le mot de passe – Budget App</title>
  <meta name="description" content="Réinitialisez le mot de passe de votre compte Budget App." />
  <link rel="canonical" href="resetpassword.html" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../Public/Assets/style.css">
</head>

<body>
  <h1 class="visually-hidden">Réinitialiser le mot de passe</h1>

    <div class="container">
        <div class="breadcrumb mt-3">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="login.html">Connexion</a></li>
                </ol>
            </nav>
        </div>

        <p class="mb-0 fs-4 text-black ms-3 fw-bold">Réinitialiser le mot de passe</p>
        <p class="small text-muted ms-3">Entrez votre adresse mail pour recevoir les instructions</p>

        <div class="form m-auto mt-3 ms-3">
            <div class="img-container mb-4 position-relative text-center">
                <img src="../Public/Assets/images/forgotpass.jpg" alt="Keylock Image"
                    style="width: 300px; margin-top: 70px; margin-bottom: 60px;">
            </div>

            <form class="mb-3 mx-3 mt-5" id="loginForm">
                <div class="mb-4 position-relative">
                    <label class="position-absolute px-2 ms-3 text-muted fs-6" style="top: -13px; left: 0;">
                        Email
                    </label>
                    <div class="border shadow-sm rounded-3 px-3 d-flex align-items-center" style="height: 50px;">
                        <input type="email" id="userIdentifier" class="form-control small border-0 bg-transparent"
                            placeholder="Exemple@gmail.com" style="box-shadow: none;" required>
                    </div>
                </div>
                <div class="d-flex justify-content-end">
                    <button class="btn custom-primary-btn text-white" id="btnToOTP">Continuer</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal fade modal-top" id="otpModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog m-0 shadow-lg">
            <div class="modal-content rounded-4 p-4 text-center">
                <button type="button" class="btn-close position-absolute top-0 start-0 m-3"
                    data-bs-dismiss="modal" aria-label="Fermer"></button>
                <h6 class="fw-semibold mb-4">Verification OTP</h6>
                <div class="d-flex justify-content-center gap-3 mb-3">
                    <input type="text" maxlength="1" class="otp-input form-control text-center"
                        style="width: 45px; height: 45px;" />
                    <input type="text" maxlength="1" class="otp-input form-control text-center"
                        style="width: 45px; height: 45px;" />
                    <input type="text" maxlength="1" class="otp-input form-control text-center"
                        style="width: 45px; height: 45px;" />
                    <input type="text" maxlength="1" class="otp-input form-control text-center"
                        style="width: 45px; height: 45px;" />
                </div>
                <p class="text-muted mb-1 small">Un code a été envoyé à votre téléphone</p>
                <p class="mb-4">
                    <span id="resendText" class="text-primary fw-semibold"><span id="timer">01:00</span></span>
                </p>
                <button class="btn btn-primary w-100 rounded-3 py-2" id="btnToLoading">Continuer</button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="loadingModal" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 bg-transparent">
                <div class="modal-body text-center">
                    <div class="spinner-border text-light" style="width: 3rem; height: 3rem;" role="status"></div>
                    <h6 class="text-white mt-3 fw-medium">Vérification en cours...</h6>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/public/js/api.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const modalOtp = new bootstrap.Modal(document.getElementById("otpModal"));
            const modalLoading = new bootstrap.Modal(document.getElementById("loadingModal"));

            // Éléments cibles
            const btnToOTP = document.getElementById("btnToOTP");
            const userIdentifierInput = document.getElementById("userIdentifier");

            // 1. Fonction de récupération et vérification
            btnToOTP.addEventListener("click", async function (e) {
                e.preventDefault(); // le bouton est dans un <form>
                const email = userIdentifierInput.value.trim();

                if (email === "") {
                    alert("Veuillez entrer votre adresse mail.");
                    return;
                }

                // POST /api/users/reset-password : le serveur génère un code à 6 chiffres
                // (en développement, le code est affiché dans les logs du serveur)
                try {
                    await api.requestPasswordReset(email);
                    // On garde l'email pour la page suivante, qui vérifie le code
                    sessionStorage.setItem("reset_email", email);
                    window.location.href = "./createnewpwd.html";
                } catch (error) {
                    alert(error.message);
                }
            });
            // 2. Auto-focus des entrées OTP
            const otpInputs = document.querySelectorAll(".otp-input");
            otpInputs.forEach((input, index) => {
                input.addEventListener("input", (e) => {
                    if (e.target.value && index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    }
                });
                input.addEventListener("keydown", (e) => {
                    if (e.key === "Backspace" && !e.target.value && index > 0) {
                        otpInputs[index - 1].focus();
                    }
                });
            });

            // 3. Timer OTP
            let timeLeft = 60;
            const timerElement = document.getElementById("timer");
            const countdown = setInterval(() => {
                let m = Math.floor(timeLeft / 60);
                let s = timeLeft % 60;
                timerElement.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    document.getElementById("resendText").innerHTML = "Renvoyer le code";
                } else {
                    timeLeft--;
                }
            }, 1000);

            // 4. Action du bouton Continuer (Transition OTP -> Loading)
            const btnToLoading = document.getElementById("btnToLoading");
            btnToLoading.addEventListener("click", function () {
                modalOtp.hide(); // Ferme OTP

                // Délai pour laisser le premier modal se fermer proprement
                setTimeout(() => {
                    modalLoading.show(); // Ouvre Loading

                    // Redirection après 2.5s
                    setTimeout(() => {
                        window.location.href = "./createnewpwd.html";
                    }, 2500);
                }, 400);
            });
        });
    </script>
</body>

</html>
