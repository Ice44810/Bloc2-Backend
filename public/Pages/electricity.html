<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facture électricité – Budget App</title>
  <meta name="description" content="Payez votre facture d'électricité depuis Budget App." />
  <link rel="canonical" href="electricity.html" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="../Public/Assets/style.css" />

</head>

<body>
  <h1 class="visually-hidden">Facture électricité</h1>

    <!-- Header -->
    <div class="container">
        <div class="breadcrumb mt-3">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index.html">Accueil</a></li>
                    <li class="breadcrumb-item"><a href="./bill.html">Factures</a></li>
                    <li class="breadcrumb-item active" aria-current="page">
                        <span class="bi bi-lightbulb-fill text-warning" style="font-size: 15px;"></span>
                        Opérateur Electricité
                    </li>
                </ol>
            </nav>
        </div>
        <!-- Contenu de la facture -->
        <div class="container">
            <div class="text-center py-4 rounded-4 border shadow-sm mb-3">
                <div class="bill-icon mb-2">
                    <img src="../Public/Assets/images/icons8-vérifier.gif" alt="bill icon">
                </div>
                <h3 id="billAmount" class="fw-bold text-danger">€70.0</h3>
                <p class="fs-5 fw-semibold">Montant à payer</p>
                <p class="text-muted">Mise à jour par le fournisseur</p>
            </div>
            <p class="fw-bold mb-3">Informations Client</p>
            <div class="text-center rounded-3 shadow-sm p-2 border">
                <div class="d-flex justify-content-between mx-2">
                    <!-- Colonne gauche -->
                    <div class="text-start">
                        <p>Code client</p>
                        <p>Nom client</p>
                        <p>Mail</p>
                    </div>
                    <!-- Colonne droite -->
                    <div class="text-end">
                        <p id="clientCode">…</p>
                        <p id="clientName">…</p>
                        <p id="clientEmail">…</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-3 d-flex justify-content-end">
            <button type="button" id="btnPayBill" class="btn btn-primary fs-5">Paiement Facture</button>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/public/js/api.js"></script>
    <script>
        // Informations client : GET /api/users/profile
        api.getProfile().then(user => {
            document.getElementById("clientCode").textContent = "BA" + String(user.id).padStart(6, "0");
            document.getElementById("clientName").textContent = user.fullName || "—";
            document.getElementById("clientEmail").textContent = user.email;
        }).catch(error => console.error("Erreur API :", error));

        // Montant de la facture (simulé : pas de vrai fournisseur derrière)
        const bill = { serviceId: 3, serviceName: "Électricité", provider: "EDF", amount: 70.0 };
        document.getElementById("billAmount").textContent = UI.formatCurrency(bill.amount);

        // Payer : on prépare le paiement puis on passe au choix de la source
        document.getElementById("btnPayBill").addEventListener("click", () => {
            Payment.start({ kind: "bill", ...bill });
        });
    </script>

</body>

</html>
