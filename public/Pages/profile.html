                <a href="./bankhistory.html"
                    class="list-group-item d-flex align-items-center justify-content-between py-3">
                    <div class="d-flex align-items-center">
                        <div class="icon-square me-3 bg-warning-subtle text-warning"><i class="bi bi-cash" aria-hidden="true"></i></div>
                        <span>Balance Compte</span>
                    </div>
                    <div class="d-flex align-items-center">
                        <span class="me-3 fw-bold">21.500€</span>
                        <i class="bi bi-chevron-right text-muted" aria-hidden="true"></i>
                    </div>
                </a>

                <a href="./rewards.html" class="list-group-item d-flex align-items-center justify-content-between py-3">

                    </div>
                    <div class="d-flex align-items-center">

                    </div>
                </a>

                <a href="./banque.html" class="list-group-item d-flex align-items-center justify-content-between py-3">
                    <div class="d-flex align-items-center">
                        <div class="icon-square me-3 bg-info-subtle text-info"><i class="bi bi-bank" aria-hidden="true"></i></div>

                    </div>
                    <div class="d-flex align-items-center">
                        <span class="me-3 text-muted">1 lien</span>
                        <i class="bi bi-chevron-right text-muted" aria-hidden="true"></i>
                    </div>

                <a href="./bill.html" class="list-group-item d-flex align-items-center justify-content-between py-3">

                        </div>
                        <span>Gestion des Factures</span>
                    </div>
                    <i class="bi bi-chevron-right text-muted" aria-hidden="true"></i>

                <a href="./topup.html" class="list-group-item d-flex align-items-center justify-content-between py-3">

                <a href="./cardinfo.html"

    <script src="/public/js/api.js"></script>
    <script>
        // GET /api/users/profile : affiche le nom et l'IBAN de l'utilisateur connecté
        async function loadProfile() {
            try {
                const user = await api.getProfile();
                document.getElementById("profileName").textContent = user.fullName || user.email;
                document.getElementById("profileAccount").textContent = user.iban || "Aucun IBAN enregistré";
            } catch (error) {
                console.error("Erreur API :", error);
            }
        }
        loadProfile();

        document.querySelector(".bi-files").addEventListener("click", () => {
            const accountNumber = document.getElementById("profileAccount").textContent;
            navigator.clipboard.writeText(accountNumber).then(() => {
                alert("Numéro copié !");
            });
        });
    </script>
